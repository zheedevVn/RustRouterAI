[package]
name = "routerai-mobile"
version = "1.0.4"
edition = "2021"
authors = ["RouterAI Team <support@mmovn.space>"]
description = "RouterAI Native Mobile Client for iOS built with 100% Rust"
homepage = "https://ai.mmovn.space"

[dependencies]
dioxus = { version = "0.5", features = ["mobile", "router"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2.5"
lazy_static = "1.4"
async-channel = "2.3"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[package.metadata.bundle]
name = "RouterAI"
identifier = "space.mmovn.routerai"
version = "1.0.3"
short_description = "Hệ thống tự động hóa và quản lý RouterAI"
long_description = "RouterAI Client chính thức dành cho hệ điều hành iOS, xây dựng 100% bằng ngôn ngữ Rust nguyên bản cho hiệu năng siêu cao và an toàn bảo mật."
icon = ["assets/icon_120.png", "assets/icon_180.png", "assets/icon_1024.png"]
copyright = "Copyright © 2021-2026 RouterAI Team"
category = "Productivity"

[package.metadata.dioxus.mobile]
app_name = "RouterAI"
identifier = "space.mmovn.routerai"
icon = "assets/icon_1024.png"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
