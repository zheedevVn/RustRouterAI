name: Build iOS IPA (Rust)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build iOS Binary (ARM64 Release)
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Package iOS IPA (Ad-Hoc / Sideload Ready)
        run: |
          mkdir -p Payload/RouterAI.app
          cp target/aarch64-apple-ios/release/routerai-mobile Payload/RouterAI.app/RouterAI
          chmod +x Payload/RouterAI.app/RouterAI
          
          # Copy Assets & Icons directly into app bundle root
          if [ -d "assets" ]; then
            cp -r assets Payload/RouterAI.app/
          fi
          if [ -d "assets/icons" ]; then
            cp assets/icons/* Payload/RouterAI.app/
            # Sideload managers (Esign, Scarlet, Sideloadly) look for iTunesArtwork at root
            cp assets/icons/iTunesArtwork iTunesArtwork 2>/dev/null || true
            cp assets/icons/iTunesArtwork@2x iTunesArtwork@2x 2>/dev/null || true
          fi

          # Compile LaunchScreen.storyboard so iOS SpringBoard knows full-screen native resolution
          if [ -f "assets/LaunchScreen.storyboard" ]; then
            echo "Compiling LaunchScreen.storyboard with ibtool..."
            xcrun ibtool --compile Payload/RouterAI.app/LaunchScreen.storyboardc assets/LaunchScreen.storyboard || true
            mkdir -p Payload/RouterAI.app/Base.lproj
            cp -r Payload/RouterAI.app/LaunchScreen.storyboardc Payload/RouterAI.app/Base.lproj/ 2>/dev/null || true
          fi

          # Copy fallback Launch Images for all iPhone screen sizes
          if [ -d "assets/launch_images" ]; then
            cp assets/launch_images/* Payload/RouterAI.app/
          fi
          
          # Create Info.plist with modern UILaunchScreen, LaunchScreen.storyboardc, UIDeviceFamily & MinimumOSVersion
          cat << 'EOF' > Payload/RouterAI.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>RouterAI</string>
              <key>CFBundleIdentifier</key>
              <string>space.mmovn.routerai</string>
              <key>CFBundleName</key>
              <string>RouterAI</string>
              <key>CFBundleDisplayName</key>
              <string>RouterAI</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon20x20</string>
                          <string>AppIcon29x29</string>
                          <string>AppIcon40x40</string>
                          <string>AppIcon60x60</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                  </dict>
              </dict>
              <key>CFBundleIcons~ipad</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon20x20</string>
                          <string>AppIcon29x29</string>
                          <string>AppIcon40x40</string>
                          <string>AppIcon60x60</string>
                          <string>AppIcon76x76</string>
                          <string>AppIcon83.5x83.5</string>
                      </array>
                      <key>CFBundleIconName</key>
                      <string>AppIcon</string>
                  </dict>
              </dict>
              <key>CFBundleIconFiles</key>
              <array>
                  <string>AppIcon20x20</string>
                  <string>AppIcon29x29</string>
                  <string>AppIcon40x40</string>
                  <string>AppIcon60x60</string>
                  <string>AppIcon76x76</string>
                  <string>AppIcon83.5x83.5</string>
                  <string>icon.png</string>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          # Create IPA archive including Payload and root iTunesArtwork
          zip -r -y RouterAI.ipa Payload iTunesArtwork iTunesArtwork@2x
          echo "IPA created successfully: $(ls -lh RouterAI.ipa)"

      - name: Upload RouterAI-iOS-Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterAI-iOS-Package
          path: RouterAI.ipa
          if-no-files-found: error
